<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Referrer Tester (path mode)</title>
<style>
  body { font-family: monospace; max-width: 700px; margin: 2em auto; padding: 0 1em; }
  input, select { width: 100%; box-sizing: border-box; margin: 4px 0 12px; padding: 6px; }
  .current-url { word-break: break-all; background: #f2f2f2; padding: 8px; }
</style>
</head>
<body>
  <h2>Referrer Payload Tester — path mode</h2>
  <p>You landed here via GitHub Pages' 404 fallback, so this page's URL is whatever path you typed:</p>
  <div class="current-url" id="current-url"></div>

  <h3>Target URL to navigate to</h3>
  <input id="target-url" placeholder="https://target.example.com/">
  <select id="policy">
    <option value="unsafe-url">unsafe-url (send full URL)</option>
    <option value="origin">origin</option>
    <option value="origin-when-cross-origin">origin-when-cross-origin</option>
    <option value="strict-origin-when-cross-origin">strict-origin-when-cross-origin (default)</option>
    <option value="no-referrer">no-referrer</option>
    <option value="same-origin">same-origin</option>
  </select>
  <button id="generate">Generate Link</button>
  <div id="output"></div>

  <script src="referrer-tester.js"></script>
</body>
</html>
