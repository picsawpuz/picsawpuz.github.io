<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Referrer Tester</title>
<style>
  body { font-family: monospace; max-width: 700px; margin: 2em auto; padding: 0 1em; }
  input, select, textarea { width: 100%; box-sizing: border-box; margin: 4px 0 12px; padding: 6px; }
  .current-url { word-break: break-all; background: #f2f2f2; padding: 8px; }
  button { padding: 6px 14px; margin-right: 6px; }
</style>
</head>
<body>
  <h2>Referrer Payload Tester</h2>

  <p><strong>This page's current URL (the referrer that will be sent):</strong></p>
  <div class="current-url" id="current-url"></div>

  <h3>1. Craft a path-based payload URL</h3>
  <label>Path payload (appended after /):</label>
  <input id="path-payload" placeholder="e.g. %22%3E%3Cscript%3Ealert(1)%3C/script%3E">
  <label>Query payload (appended as ?):</label>
  <input id="query-payload" placeholder="e.g. x=<script>alert(1)</script>">
  <button id="build-crafted">Build crafted URL</button>
  <div class="current-url" id="crafted-url"></div>

  <h3>2. Target URL to navigate to (for referrer leak test)</h3>
  <input id="target-url" placeholder="https://target.example.com/">

  <label>Referrer-Policy to apply on the link:</label>
  <select id="policy">
    <option value="unsafe-url">unsafe-url (send full URL)</option>
    <option value="origin">origin (send only origin)</option>
    <option value="origin-when-cross-origin">origin-when-cross-origin</option>
    <option value="strict-origin-when-cross-origin">strict-origin-when-cross-origin (browser default)</option>
    <option value="no-referrer">no-referrer (send nothing)</option>
    <option value="same-origin">same-origin</option>
  </select>

  <button id="generate">Generate Link</button>
  <div id="output"></div>

  <script src="referrer-tester.js"></script>
</body>
</html>
